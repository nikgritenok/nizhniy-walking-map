<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Прогулка по Нижнему Новгороду</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}#map{position:fixed;inset:0}.panel{position:fixed;top:12px;left:12px;right:55px;background:white;border-radius:12px;padding:12px;box-shadow:0 2px 12px #0003}.panel strong{font-size:16px}.panel p{margin:5px 0 0;color:#555}.actions{position:fixed;bottom:20px;left:12px;right:12px;display:flex;gap:8px}button{flex:1;padding:13px;border:0;border-radius:12px;background:white;box-shadow:0 2px 12px #0003;font-weight:bold}.pin{background:#1456d9;color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:bold;box-shadow:0 2px 7px #0006}#error{display:none;position:fixed;top:105px;left:12px;right:12px;background:#fff3d9;padding:12px;border-radius:12px}</style></head><body><div id="map"></div><div class="panel"><strong>Нижний Новгород · 27 октября</strong><p>10 остановок от Marins Park до Чкаловской лестницы. Линия соединяет точки по порядку, это не точная пешая навигация.</p></div><div id="error">Карта не загрузилась. Проверьте интернет и доступ к OpenFreeMap.</div><div class="actions"><button id="all">Весь маршрут</button><button id="next">Следующая точка →</button></div><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const stops=[["Marins Park Hotel",43.9466,56.3241],["Собор Александра Невского",43.9696,56.3333],["Пакгаузы",43.972,56.3337],["Стрелка",43.9744,56.337],["Канавинский мост",43.9661,56.3236],["Рождественская улица",43.9818,56.3257],["Набережная Федоровского",43.9868,56.3239],["Большая Покровская",44.0002,56.3214],["Нижегородский кремль",44.0046,56.3288],["Чкаловская лестница",44.009,56.3328]];let index=-1;
if(!window.maplibregl){document.getElementById("error").style.display="block"}else{
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[43.98,56.328],zoom:12});map.addControl(new maplibregl.NavigationControl(),"top-right");
function fit(){const bounds=new maplibregl.LngLatBounds();stops.forEach(s=>bounds.extend([s[1],s[2]]));map.fitBounds(bounds,{padding:{top:140,bottom:95,left:35,right:35}})}
document.getElementById("all").onclick=fit;document.getElementById("next").onclick=()=>{index=(index+1)%stops.length;map.flyTo({center:[stops[index][1],stops[index][2]],zoom:15})};
map.on("load",()=>{map.addSource("route",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:stops.map(s=>[s[1],s[2]])}}});map.addLayer({id:"route-halo",type:"line",source:"route",paint:{"line-color":"white","line-width":8}});map.addLayer({id:"route-line",type:"line",source:"route",paint:{"line-color":"#1456d9","line-width":5}});stops.forEach((s,i)=>{const el=document.createElement("div");el.className="pin";el.textContent=i+1;new maplibregl.Marker({element:el}).setLngLat([s[1],s[2]]).setPopup(new maplibregl.Popup({offset:18}).setText((i+1)+". "+s[0])).addTo(map)});fit()})}
</script></body></html>
