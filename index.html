<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Нижний Новгород — прогулка</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#17243a}#map{position:fixed;inset:0}.header{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:62px;background:#fffffff2;backdrop-filter:blur(12px);border-radius:15px;padding:12px 14px;box-shadow:0 3px 16px #0002}.header strong{font-size:16px}.sub{font-size:12px;color:#596579;margin-top:4px}.actions{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 16px);left:12px;right:12px;display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:12px;background:white;padding:13px 7px;font-size:14px;font-weight:700;box-shadow:0 2px 12px #0003;color:#1555c5}.pin{width:29px;height:29px;border-radius:50%;background:#175fe8;color:white;border:2px solid white;display:grid;place-items:center;font-weight:750;box-shadow:0 2px 6px #0005}.pin.active{background:#e65b25;transform:scale(1.18)}#sheet{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 75px);left:12px;right:12px;max-height:55vh;overflow:auto;background:white;border-radius:16px;padding:12px 16px;box-shadow:0 5px 25px #0004;display:none}#sheet h3{margin:2px 0 10px}#sheet ol{padding-left:25px;margin:0}#sheet li{padding:7px 0;border-bottom:1px solid #eee}#sheet li button{background:none;border:0;text-align:left;font:inherit;color:#1859d2;padding:0}#close{float:right;background:#eee;border:0;border-radius:8px;padding:5px 10px}.maplibregl-ctrl-top-right{top:95px}</style></head><body><div id="map"></div><div class="header"><strong>🚶 Нижний Новгород · 27 октября</strong><div class="sub" id="status">Valhalla: строим пеший маршрут…</div></div><div id="sheet"><button id="close">Закрыть</button><h3>Остановки</h3><ol id="list"></ol></div><div class="actions"><button id="all">Весь маршрут</button><button id="listbtn">Все точки</button><button id="next">Далее →</button></div><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const stops=[["Marins Park Hotel",43.9466,56.3241],["Собор Александра Невского",43.9696,56.3333],["Пакгаузы (снаружи)",43.972,56.3337],["Стрелка",43.9744,56.337],["Канавинский мост",43.9655,56.3215],["Рождественская улица",43.9818,56.3257],["Набережная Федоровского",43.9868,56.3239],["Большая Покровская",44.0002,56.3214],["Нижегородский кремль",44.0046,56.3288],["Чкаловская лестница",44.009,56.3328]];
let index=-1;const status=document.getElementById("status");const sheet=document.getElementById("sheet");document.getElementById("close").onclick=()=>sheet.style.display="none";document.getElementById("listbtn").onclick=()=>sheet.style.display=sheet.style.display==="block"?"none":"block";
if(!window.maplibregl){status.textContent="Не удалось загрузить MapLibre — проверьте соединение"}else{
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[43.98,56.328],zoom:12});map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");const markers=[];
function fit(coords){const b=new maplibregl.LngLatBounds();coords.forEach(c=>b.extend(c));map.fitBounds(b,{padding:{top:150,bottom:110,left:40,right:40},duration:500})}
function select(i){index=i;markers.forEach((m,j)=>m.getElement().classList.toggle("active",j===i));map.flyTo({center:[stops[i][1],stops[i][2]],zoom:15.5});markers[i].togglePopup();sheet.style.display="none"}
document.getElementById("all").onclick=()=>fit(stops.map(s=>[s[1],s[2]]));document.getElementById("next").onclick=()=>select((index+1)%stops.length);
const list=document.getElementById("list");stops.forEach((s,i)=>{const li=document.createElement("li");const b=document.createElement("button");b.textContent=s[0];b.onclick=()=>select(i);li.appendChild(b);list.appendChild(li)});
map.on("load",async()=>{stops.forEach((s,i)=>{const el=document.createElement("div");el.className="pin";el.textContent=i+1;markers.push(new maplibregl.Marker({element:el}).setLngLat([s[1],s[2]]).setPopup(new maplibregl.Popup({offset:18}).setText((i+1)+". "+s[0])).addTo(map))});fit(stops.map(s=>[s[1],s[2]]));
try{const payload={locations:stops.map(s=>({lat:s[2],lon:s[1],type:"break"})),costing:"pedestrian",shape_format:"geojson",units:"kilometers",directions_options:{language:"ru",units:"kilometers"}};const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);let res;try{res=await fetch("https://valhalla1.openstreetmap.de/route?json="+encodeURIComponent(JSON.stringify(payload)),{signal:controller.signal})}finally{clearTimeout(timeout)}if(!res.ok)throw Error("Valhalla HTTP "+res.status);const data=await res.json();if(data.error||!data.trip?.legs?.length)throw Error(data.error||"Маршрут не найден");const coords=[];for(const leg of data.trip.legs){let points=leg.shape;if(typeof points==="string")throw Error("Valhalla returned encoded geometry");if(points?.type==="LineString")points=points.coordinates;if(!Array.isArray(points))throw Error("No geometry");for(const point of points)coords.push(point)}if(coords.length<2)throw Error("Empty geometry");map.addSource("walk",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:coords},properties:{}}});map.addLayer({id:"walk-outline",type:"line",source:"walk",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#fff","line-width":9}});map.addLayer({id:"walk-line",type:"line",source:"walk",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#1260e8","line-width":5}});status.textContent="Пешком по улицам · ≈ "+data.trip.summary.length.toFixed(1)+" км · 10 остановок";fit(coords)}catch(e){status.textContent="Пешеходный маршрут временно не загрузился. Точки доступны; прямые линии не рисуем.";console.warn(e)}
})}
</script></body></html>
